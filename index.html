<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Preview</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f6f8;
        }
        * { box-sizing: border-box; }
        html, body, #container { width: 100%; height: 100%; min-height: 100%; margin: 0; }
        body { overflow: hidden; }
        #webContainer, #imageWrapper, #pdfViewer, #workbookContainer {
            display: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #imageWrapper { overflow: auto; line-height: 0; }
        #directImage { width: 100%; height: auto; }
        #embeddedLink, #pdfViewer {
            width: 100%;
            height: 100vh;
            min-height: 480px;
            border: 0;
            background: #fff;
        }
        #status {
            display: none;
            min-height: 100vh;
            padding: 28px 20px;
            align-items: center;
            justify-content: center;
        }
        .status-card {
            width: min(460px, 100%);
            padding: 24px;
            border: 1px solid #dce2ea;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(23, 32, 51, 0.08);
            text-align: center;
        }
        .status-card h1 { margin: 0 0 8px; font-size: 1.15rem; line-height: 1.35; }
        .status-card p { margin: 0; color: #5d687a; font-size: 0.95rem; line-height: 1.5; }
        .actions { display: flex; justify-content: center; margin-top: 20px; }
        .button-link {
            min-height: 42px;
            padding: 10px 16px;
            border: 1px solid #0f6cbd;
            border-radius: 8px;
            color: #0f6cbd;
            background: #fff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
        }
        .spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto 16px;
            border: 3px solid #dce7f2;
            border-top-color: #0f6cbd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #workbookContainer { flex-direction: column; background: #fff; }
        .workbook-header {
            display: flex;
            min-height: 48px;
            padding: 10px 14px;
            align-items: center;
            border-bottom: 1px solid #d9dee7;
            background: #f8fafc;
        }
        #workbookTitle {
            overflow: hidden;
            margin: 0;
            font-size: 0.95rem;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #sheetViewport {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #eef1f4;
        }
        #sheetTable {
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        #sheetTable td, #sheetTable th {
            min-width: 72px;
            height: 28px;
            padding: 5px 8px;
            border-right: 1px solid #dfe3e8;
            border-bottom: 1px solid #dfe3e8;
            color: #1d2733;
            background: #fff;
            line-height: 1.25;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
        }
        #sheetTabs {
            display: flex;
            min-height: 44px;
            overflow-x: auto;
            align-items: flex-end;
            gap: 2px;
            padding: 6px 10px 0;
            border-top: 1px solid #d9dee7;
            background: #f3f5f7;
        }
        .sheet-tab {
            min-height: 36px;
            padding: 7px 14px;
            border: 0;
            border-bottom: 3px solid transparent;
            border-radius: 6px 6px 0 0;
            color: #425168;
            background: transparent;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .sheet-tab:hover { background: #e8edf2; }
        .sheet-tab.active { border-bottom-color: #217346; color: #185c37; background: #fff; }
        .sheet-tab:focus-visible, .button-link:focus-visible {
            outline: 3px solid rgba(15, 108, 189, 0.32);
            outline-offset: 2px;
        }
        @media (max-width: 600px) {
            .workbook-header { min-height: 44px; padding: 8px 10px; }
            #sheetTable { font-size: 13px; }
            #sheetTable td, #sheetTable th { min-width: 64px; padding: 4px 6px; }
        }
    </style>
</head>
<body>
    <main id="container">
        <section id="status" aria-live="polite"></section>
        <section id="workbookContainer" aria-label="Excel workbook preview">
            <header class="workbook-header"><h1 id="workbookTitle">Excel workbook</h1></header>
            <div id="sheetViewport" tabindex="0" aria-label="Worksheet cells"></div>
            <nav id="sheetTabs" role="tablist" aria-label="Worksheets"></nav>
        </section>
        <div id="webContainer">
            <iframe id="embeddedLink" title="Embedded content" scrolling="yes"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-top-navigation-by-user-activation"></iframe>
        </div>
        <div id="imageWrapper"><img id="directImage" alt="Embedded content"></div>
        <iframe id="pdfViewer" title="Document preview"></iframe>
    </main>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="./app.js?v=3"></script>
</body>
</html>
