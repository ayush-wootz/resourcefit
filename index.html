<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Preview</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f6f8;
        }
        * { box-sizing: border-box; }
        html, body, #container { width: 100%; height: 100%; min-height: 100%; margin: 0; }
        body { overflow: hidden; }
        #webContainer, #imageWrapper, #pdfViewer, #workbookContainer, #driveContainer {
            display: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #imageWrapper { overflow: auto; line-height: 0; }
        #directImage { width: 100%; height: auto; }
        #embeddedLink, #pdfViewer {
            width: 100%;
            height: 100vh;
            min-height: 480px;
            border: 0;
            background: #fff;
        }
        #status {
            display: none;
            min-height: 100vh;
            padding: 28px 20px;
            align-items: center;
            justify-content: center;
        }
        .status-card {
            width: min(460px, 100%);
            padding: 24px;
            border: 1px solid #dce2ea;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(23, 32, 51, 0.08);
            text-align: center;
        }
        .status-card h1 { margin: 0 0 8px; font-size: 1.15rem; line-height: 1.35; }
        .status-card p { margin: 0; color: #5d687a; font-size: 0.95rem; line-height: 1.5; }
        .actions { display: flex; justify-content: center; margin-top: 20px; }
        .button-link {
            min-height: 42px;
            padding: 10px 16px;
            border: 1px solid #0f6cbd;
            border-radius: 8px;
            color: #0f6cbd;
            background: #fff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
        }
        .spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto 16px;
            border: 3px solid #dce7f2;
            border-top-color: #0f6cbd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #workbookContainer, #driveContainer { flex-direction: column; background: #fff; }
        #driveFrame { flex: 1; min-height: 0; width: 100%; border: 0; background: #fff; }
        .header-link {
            margin-left: auto;
            padding-left: 12px;
            color: #0f6cbd;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        .header-link:hover { text-decoration: underline; }
        .workbook-header {
            display: flex;
            min-height: 48px;
            padding: 10px 14px;
            align-items: center;
            border-bottom: 1px solid #d9dee7;
            background: #f8fafc;
        }
        #workbookTitle, #driveTitle {
            overflow: hidden;
            margin: 0;
            font-size: 0.95rem;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #sheetViewport {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #eef1f4;
        }
        #sheetSurface { width: max-content; }
        #viewerControls {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            border: 1px solid #d9dee7;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 6px 20px rgba(23, 32, 51, 0.16);
        }
        #zoomControls { display: none; align-items: center; gap: 4px; }
        .control-button {
            min-width: 36px;
            min-height: 36px;
            padding: 6px 10px;
            border: 0;
            border-radius: 8px;
            color: #2c3a4f;
            background: transparent;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .control-button:hover { background: #eef1f5; }
        .control-button:focus-visible {
            outline: 3px solid rgba(15, 108, 189, 0.32);
            outline-offset: 2px;
        }
        #zoomReset { min-width: 52px; }
        .control-divider { width: 1px; height: 22px; background: #dce2ea; }
        body.maximized #container {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #fff;
        }
        #sheetTable {
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        #sheetTable td, #sheetTable th {
            min-width: 72px;
            height: 28px;
            padding: 5px 8px;
            border-right: 1px solid #dfe3e8;
            border-bottom: 1px solid #dfe3e8;
            color: #1d2733;
            background: #fff;
            line-height: 1.25;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
        }
        #driveTabs, #sheetTabs {
            display: flex;
            min-height: 44px;
            overflow-x: auto;
            align-items: flex-end;
            gap: 2px;
            padding: 6px 10px 0;
            border-top: 1px solid #d9dee7;
            background: #f3f5f7;
        }
        .sheet-tab {
            min-height: 36px;
            padding: 7px 14px;
            border: 0;
            border-bottom: 3px solid transparent;
            border-radius: 6px 6px 0 0;
            color: #425168;
            background: transparent;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .sheet-tab:hover { background: #e8edf2; }
        .sheet-tab.active { border-bottom-color: #217346; color: #185c37; background: #fff; }
        .sheet-tab:focus-visible, .button-link:focus-visible, .header-link:focus-visible {
            outline: 3px solid rgba(15, 108, 189, 0.32);
            outline-offset: 2px;
        }
        @media (max-width: 600px) {
            .workbook-header { min-height: 44px; padding: 8px 10px; }
            #sheetTable { font-size: 13px; }
            #sheetTable td, #sheetTable th { min-width: 64px; padding: 4px 6px; }
        }
    </style>
</head>
<body>
    <main id="container">
        <section id="status" aria-live="polite"></section>
        <section id="workbookContainer" aria-label="Excel workbook preview">
            <header class="workbook-header"><h1 id="workbookTitle">Excel workbook</h1></header>
            <div id="sheetViewport" tabindex="0" aria-label="Worksheet cells"></div>
            <nav id="sheetTabs" role="tablist" aria-label="Worksheets"></nav>
        </section>
        <section id="driveContainer" aria-label="Google Drive preview">
            <header class="workbook-header">
                <h1 id="driveTitle">Google Drive file</h1>
                <a id="driveOpen" class="header-link" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">Open in Drive</a>
            </header>
            <iframe id="driveFrame" title="Google Drive preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
            <nav id="driveTabs" role="tablist" aria-label="Files"></nav>
        </section>
        <div id="webContainer">
            <iframe id="embeddedLink" title="Embedded content" scrolling="yes" allowfullscreen
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-top-navigation-by-user-activation"></iframe>
        </div>
        <div id="imageWrapper"><img id="directImage" alt="Embedded content"></div>
        <iframe id="pdfViewer" title="Document preview" allowfullscreen></iframe>
        <div id="viewerControls">
            <div id="zoomControls" role="group" aria-label="Zoom">
                <button type="button" id="zoomOut" class="control-button" aria-label="Zoom out">&minus;</button>
                <button type="button" id="zoomReset" class="control-button" aria-label="Reset zoom">100%</button>
                <button type="button" id="zoomIn" class="control-button" aria-label="Zoom in">&plus;</button>
                <span class="control-divider" aria-hidden="true"></span>
            </div>
            <button type="button" id="fullscreenToggle" class="control-button" aria-label="Toggle fullscreen" title="Fullscreen">&#9974;</button>
            <a id="openTab" class="control-button" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open in a new tab" title="Open in a new tab">&#8599;</a>
        </div>
    </main>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="./zoom.js?v=zoom-1"></script>
    <script src="./viewer-config.js?v=render-1"></script>
    <script src="./app.js?v=drive-preview-2"></script>
</body>
</html>
