<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Preview</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f5f7fa;
        }
        * { box-sizing: border-box; }
        html, body, #container { width: 100%; min-height: 100%; margin: 0; }
        body { overflow-x: hidden; }
        #webContainer, #imageWrapper, #pdfViewer, #officeContainer {
            display: none;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        #imageWrapper { line-height: 0; }
        #directImage { width: 100%; height: auto; }
        #embeddedLink, #pdfViewer, #officePreview {
            width: 100%;
            height: 100vh;
            min-height: 480px;
            border: 0;
            background: #fff;
        }
        #status {
            display: none;
            min-height: 100vh;
            padding: 28px 20px;
            align-items: center;
            justify-content: center;
        }
        .status-card {
            width: min(440px, 100%);
            padding: 24px;
            border: 1px solid #dce2ea;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(23, 32, 51, 0.08);
            text-align: center;
        }
        .status-card h1 { margin: 0 0 8px; font-size: 1.15rem; line-height: 1.35; }
        .status-card p { margin: 0; color: #5d687a; font-size: 0.95rem; line-height: 1.5; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        button, .button-link {
            min-height: 42px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #0f6cbd;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        button { color: #fff; background: #0f6cbd; }
        .button-link { color: #0f6cbd; background: #fff; }
        .spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto 16px;
            border: 3px solid #dce7f2;
            border-top-color: #0f6cbd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <main id="container">
        <section id="status" aria-live="polite"></section>
        <div id="officeContainer">
            <iframe id="officePreview" name="office-preview" title="Microsoft Excel preview"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-top-navigation-by-user-activation"></iframe>
        </div>
        <div id="webContainer">
            <iframe id="embeddedLink" title="Embedded content" scrolling="yes"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-top-navigation-by-user-activation"></iframe>
        </div>
        <div id="imageWrapper"><img id="directImage" alt="Embedded content"></div>
        <iframe id="pdfViewer" title="Document preview"></iframe>
    </main>
    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.21.0/lib/msal-browser.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
